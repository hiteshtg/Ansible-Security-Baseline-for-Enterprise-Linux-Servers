---
# tasks file for firewall_cofiguration
- name: ensure firewall is installed
  ansible.builtin.dnf:
    name: firewalld
    state: present

- name: enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true

- name: allow required firewall ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ allowed_firewall_ports }}"

- name: block required firewall ports
  ansible.posix.firewalld:
    port: "{{ item }}"
    state: disabled
    permanent: true
    immediate: true
  loop: "{{ blocked_firewall_ports }}"
