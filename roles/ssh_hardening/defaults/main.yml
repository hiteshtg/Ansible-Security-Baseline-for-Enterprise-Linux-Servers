---
# defaults file for ssh_hardening
ssh_config:
  - key: "Port"
    value: "{{ ssh_port }}"
  - key: "PermitRootLogin"
    value: "no"
  - key: "PasswordAuthentication"
    value: "no"
  - key: "PubkeyAuthentication"
    value: "yes"
  - key: "X11Forwarding"
    value: "no"
  - key: "MaxAuthTries"
    value: "3"
  - key: "PermitEmptyPasswords"
    value: "no"
