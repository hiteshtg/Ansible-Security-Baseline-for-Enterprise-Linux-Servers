---
# tasks file for secure_file_permission
- name: secure shadow file
  ansible.builtin.file:
    path: /etc/shadow
    owner: root
    group: root
    mode: '0000'

- name: secure ssh config directory
  ansible.builtin.file:
    path: /etc/ssh
    owner: root
    group: root
    mode: '755'

- name: secure ssh private host keys
  ansible.builtin.command:
    cmd: find /etc/ssh -maxdepth 1 -type f -name 'ssh_host_*_key' -exec chmod 0600 {} \;
  changed_when: false
